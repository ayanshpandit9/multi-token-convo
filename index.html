<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faiizu Gangster Tool</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0d0d12;
      --bg-darker: #07070a;
      --accent: #ff2a6d;
      --accent-dark: #d1004d;
      --text: #e0e0e8;
      --text-dim: #a0a0b0;
      --card-bg: #151520;
      --card-border: #252535;
      --input-bg: #1a1a2a;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(120, 20, 80, 0.2) 0%, transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(80, 20, 120, 0.2) 0%, transparent 25%),
        radial-gradient(circle at 50% 80%, rgba(160, 30, 90, 0.2) 0%, transparent 25%);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      position: relative;
    }
    
    .header h1 {
      color: var(--accent);
      margin: 0;
      font-size: 3rem;
      letter-spacing: 3px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      text-shadow: 0 0 15px var(--accent);
      position: relative;
      display: inline-block;
      padding: 0 20px;
    }
    
    .header h1::before,
    .header h1::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 30px;
      height: 3px;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }
    
    .header h1::before {
      left: -40px;
    }
    
    .header h1::after {
      right: -40px;
    }
    
    .header p {
      color: var(--text-dim);
      margin: 10px 0 0;
      font-size: 1.2rem;
      letter-spacing: 2px;
      font-weight: 500;
    }
    
    .panel {
      background-color: rgba(21, 21, 32, 0.9);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 0 30px rgba(255, 42, 109, 0.15);
      backdrop-filter: blur(5px);
      position: relative;
      overflow: hidden;
    }
    
    .panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(to right, transparent, var(--accent), transparent);
      box-shadow: 0 0 15px var(--accent);
    }
    
    .panel-title {
      color: var(--accent);
      margin-top: 0;
      margin-bottom: 25px;
      padding-bottom: 15px;
      font-size: 1.8rem;
      text-shadow: 0 0 5px var(--accent);
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 1px;
      text-align: center;
      border-bottom: 1px solid var(--card-border);
      position: relative;
    }
    
    .panel-title::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 3px;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }
    
    .form-group {
      margin-bottom: 25px;
    }
    
    label {
      display: block;
      margin-bottom: 10px;
      color: var(--text-dim);
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }
    
    input[type="text"],
    input[type="number"],
    input[type="file"],
    input[type="password"],
    select {
      width: 100%;
      padding: 14px 16px;
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.1rem;
      font-weight: 500;
      border-radius: 6px;
      transition: all 0.3s;
    }
    
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(255, 42, 109, 0.3);
    }
    
    input[type="radio"] {
      margin-right: 10px;
      accent-color: var(--accent);
      transform: scale(1.2);
    }
    
    .radio-group {
      margin-bottom: 25px;
      padding: 15px;
      background: rgba(30, 30, 45, 0.5);
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }
    
    .radio-group label {
      margin-bottom: 15px;
      font-size: 1.1rem;
    }
    
    .radio-option {
      display: inline-block;
      margin-right: 30px;
      font-weight: 600;
      font-size: 1.1rem;
    }
    
    button {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: white;
      border: none;
      padding: 16px 24px;
      font-family: 'Orbitron', sans-serif;
      font-weight: bold;
      font-size: 1.2rem;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 0 20px rgba(255, 42, 109, 0.3);
      margin-bottom: 15px;
      position: relative;
      overflow: hidden;
      z-index: 1;
    }
    
    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: all 0.5s;
      z-index: -1;
    }
    
    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 25px rgba(255, 42, 109, 0.5);
    }
    
    button:hover::before {
      left: 100%;
    }
    
    .threads-btn {
      background: linear-gradient(135deg, #252540, #151530);
    }
    
    .threads-btn:hover {
      background: linear-gradient(135deg, #353550, #252540);
    }
    
    .glow {
      animation: glow 2s infinite alternate;
    }
    
    @keyframes glow {
      from { 
        text-shadow: 0 0 5px var(--accent); 
      }
      to { 
        text-shadow: 0 0 15px var(--accent), 0 0 25px var(--accent-dark); 
      }
    }
    
    .file-input-container {
      position: relative;
    }
    
    .file-input-container::after {
      content: 'Choose File';
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--accent);
      color: white;
      padding: 8px 15px;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: 600;
      pointer-events: none;
    }
    
    input[type="file"] {
      padding-right: 100px;
    }
    
    @media (max-width: 768px) {
      .header h1 {
        font-size: 2.2rem;
      }
      
      .header h1::before,
      .header h1::after {
        display: none;
      }
      
      .panel {
        padding: 20px;
      }
      
      .radio-option {
        display: block;
        margin-right: 0;
        margin-bottom: 10px;
      }
    }
  </style>
  <script>
    function toggleInput() {
      const type = document.querySelector('input[name="tokenType"]:checked').value;
      document.getElementById('single').style.display = (type === 'single') ? 'block' : 'none';
      document.getElementById('multi').style.display = (type === 'multi') ? 'block' : 'none';
    }
    
    // Initialize on page load
    window.onload = function() {
      toggleInput();
    };
  </script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="glow">CONV0 S3RV3R</h1>
      <p>Free Server Kabhi Be Ruk SakTa hai !! </p>
    </div>
    
    <div class="panel">
      <h2 class="panel-title">ENTER DETAILS</h2>
      
      <form method="POST" enctype="multipart/form-data">
        <div class="form-group radio-group">
          <label>TOKEN TYPE:</label>
          <div class="radio-option">
            <input type="radio" name="tokenType" value="single" checked onchange="toggleInput()"> SINGLE TOKEN
          </div>
          <div class="radio-option">
            <input type="radio" name="tokenType" value="multi" onchange="toggleInput()"> MULTI TOKENS
          </div>
        </div>
        
        <div class="form-group" id="single">
          <label>ACCESS TOKEN:</label>
          <input type="text" name="accessToken" placeholder="Enter your access token">
        </div>
        
        <div class="form-group" id="multi" style="display:none;">
          <label>UPLOAD TOKEN FILE (.TXT):</label>
          <div class="file-input-container">
            <input type="file" name="tokenFile" accept=".txt">
          </div>
        </div>
        
        <div class="form-group">
          <label>THREAD ID:</label>
          <input type="text" name="threadId" required placeholder="Enter thread ID">
        </div>
        
        <div class="form-group">
          <label>HET3R NAME:</label>
          <input type="text" name="kidx" required placeholder="Enter het3r name">
        </div>
        
        <div class="form-group">
          <label>MESSAGES FILE (.TXT):</label>
          <div class="file-input-container">
            <input type="file" name="txtFile" accept=".txt" required>
          </div>
        </div>
        
        <div class="form-group">
          <label>DELAY (SECONDS):</label>
          <input type="number" name="time" required min="1" placeholder="Enter delay in seconds">
        </div>
        
        <button type="submit"><i class="fas fa-play"></i> START MESSAGING</button>
        <a href="/status"><button type="button" class="threads-btn"><i class="fas fa-list"></i> SHOW THREADS</button></a>
      </form>
    </div>
  </div>

  <script>
    // Add animation to inputs when focused
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('focus', function() {
        this.parentElement.style.transform = 'translateY(-3px)';
        this.parentElement.style.transition = 'transform 0.3s';
      });
      
      input.addEventListener('blur', function() {
        this.parentElement.style.transform = 'translateY(0)';
      });
    });
  </script>
</body>
</html>
